<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyBudgetTracking - Tambah Wishlist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg,#a8dadc,#457b9d); color:#333; min-height:100vh; }
  .header { background:#1b263b; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  .header h1 { margin:0; font-size:20px; font-weight:600; }
  .profile-header { display:flex; align-items:center; gap:10px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:#ccc; cursor:pointer; object-fit:cover; }
  .welcome { font-size:14px; font-weight:500; }
  .container { max-width:95%; margin:20px auto; background:#f0f0f0; padding:20px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); }
  h2 { margin-top:0; color:#1b263b; text-align:center; }
  input, select, button { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; font-size:14px; }
  button { background:#1b263b; color:#fff; border:none; font-weight:600; cursor:pointer; transition:0.3s; }
  button:hover { background:#415a77; }

  @media (max-width:480px){
    .header h1 { font-size:18px; }
    .welcome { font-size:12px; }
    input, select, button { font-size:13px; padding:8px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>MyBudgetTracking</h1>
    <div class="profile-header">
      <div class="welcome">Welcome, <span id="username">Guest</span></div>
      <img id="avatarSmall" class="avatar" src="" alt="avatar" onclick="editProfile()">
    </div>
  </div>

  <div class="container">
    <h2>Tambah Item Wishlist</h2>
    <input type="text" id="name" placeholder="Nama Item">
    <input type="number" id="price" placeholder="Harga (RM)">
    <input type="text" id="category" placeholder="Kategori">
    <select id="priority">
      <option value="Tinggi">Tinggi</option>
      <option value="Sederhana">Sederhana</option>
      <option value="Rendah">Rendah</option>
    </select>
    <input type="date" id="date">
    <button onclick="addItem()">Simpan Item</button>
    <button onclick="goBack()">⬅ Kembali ke Senarai</button>
  </div>

<script>
  let currentUser = null;

  window.onload = () => {
    // check session
    currentUser = localStorage.getItem("MBT_session");
    if(!currentUser){
      window.location.href = "login.html";
      return;
    }

    // load user data ikut session
    let userData = localStorage.getItem("MBT_user_" + currentUser);
    if(userData){
      let user = JSON.parse(userData);
      document.getElementById("username").textContent = user.username;
      if(user.avatar){ document.getElementById("avatarSmall").src = user.avatar; }
    }
  };

  function editProfile(){ window.location.href = "profile.html"; }
  function goBack(){ window.location.href = "wishlist1.html"; }

  function addItem(){
    const name = document.getElementById("name").value.trim();
    const price = parseFloat(document.getElementById("price").value);
    const category = document.getElementById("category").value.trim();
    const priority = document.getElementById("priority").value;
    const date = document.getElementById("date").value;

    if(!name || isNaN(price)){ alert("Isi nama dan harga!"); return; }

    let wishlist = JSON.parse(localStorage.getItem("wishlist_" + currentUser)) || [];
    wishlist.push({
      name, price, category, priority, date,
      saved: 0, progress: 0, bought: false
    });
    localStorage.setItem("wishlist_" + currentUser, JSON.stringify(wishlist));
    alert("Item baru ditambah!");
    window.location.href = "wishlist1.html"; // balik ke senarai utama
  }
</script>
</body>
</html>
