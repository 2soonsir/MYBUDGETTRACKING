<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Intro - MyBudgetTracking</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b); /* navy gradient */
    color: #e0e1dd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
  }
  .screen {
    max-width: 600px;
  }
  .fade-text {
    font-family: "Playfair Display", serif;
    font-size: 30px;
    font-weight: 600;
    opacity: 0;
    animation: fadeInOut 4s forwards;
    margin-bottom: 20px;
    color: #a9bcd0;
  }
  .title {
    font-family: "Poppins", sans-serif;
    font-size: 46px;
    font-weight: 600;
    opacity: 0;
    animation: fadeIn 4s forwards;
    animation-delay: 4s;
    margin-top: 20px;
    color: #e0e1dd;
  }

  @keyframes fadeInOut {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="fade-text">Gagakz Studio Present</div>
    <div class="title">MyBudgetTracking</div>
  </div>

<script>
  // selepas animation habis, auto pergi login
  setTimeout(function(){
    window.location.href = "login.html";
  }, 8000); // 8s lepas intro
</script>
</body>
</html>
