<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Tambah Item Wishlist</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg,#a8dadc,#457b9d); color:#333; min-height:100vh; }
  .header {
    background:#1b263b; color:#fff; padding:15px 20px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .header h1 { margin:0; font-size:20px; font-weight:600; }
  .profile-header { display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#ccc; cursor:pointer; object-fit:cover; }
  .welcome { font-size:14px; font-weight:500; }
  .container { max-width:720px; margin:30px auto; padding:20px; }
  .form-box {
    margin:0 auto; background:#f0f0f0; padding:24px; border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15); width:420px; text-align:center;
  }
  h2 { margin-top:0; color:#1b263b; }
  input,select { padding:10px; margin:8px 0; width:92%; border-radius:8px; border:1px solid #ccc; background:#e9e9e9; font-size:14px; }
  .row { display:flex; gap:8px; justify-content:center; }
  .row input { width:44%; }
  .actions { margin-top:12px; display:flex; gap:8px; justify-content:center; }
  button { padding:10px 18px; margin:6px; background:#1b263b; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:0.18s; }
  button:hover { background:#415a77; }
  .hint { font-size:13px; color:#555; margin-top:6px; }
</style>
</head>
<body>
  <div class="header">
    <h1>MyBudgetTracking</h1>
    <div class="profile-header">
      <div class="welcome">Welcome, <span id="username">Guest</span></div>
      <img id="avatarSmall" class="avatar" src="" alt="avatar" onclick="editProfile()">
    </div>
  </div>

  <div class="container">
    <div class="form-box">
      <h2>Tambah Item Wishlist</h2>

      <input type="text" id="itemName" placeholder="Nama item (contoh: PS5)">
      <div class="row">
        <input type="number" id="itemPrice" placeholder="Harga (RM)">
        <input type="number" id="itemSaved" placeholder="Duit disimpan (RM)">
      </div>

      <select id="itemCategory">
        <option value="Gadget">Gadget</option>
        <option value="Pakaian">Pakaian</option>
        <option value="Travel">Travel</option>
        <option value="Lain-lain">Lain-lain</option>
      </select>

      <select id="itemPriority">
        <option value="Tinggi">Priority Tinggi</option>
        <option value="Sederhana">Priority Sederhana</option>
        <option value="Rendah">Priority Rendah</option>
      </select>

      <input type="date" id="itemDate">

      <div class="actions">
        <button onclick="addItem()">💾 Simpan Item</button>
        <button onclick="goBack()">⬅ Kembali ke Wishlist</button>
      </div>

      <div class="hint">Isi Harga dan Duit disimpan sahaja — sistem akan kira progress automatik.</div>
    </div>
  </div>

<script>
  window.onload = () => {
    const user = JSON.parse(localStorage.getItem("MBT_user"));
    if(user){
      if(user.username){
        document.getElementById("username").textContent = user.username;
      }
      if(user.avatar){
        document.getElementById("avatarSmall").src = user.avatar;
      }
    }
  };

  function editProfile(){
     window.location.href = "profile.html";
  }

  function addItem(){
    const name = document.getElementById("itemName").value.trim();
    const price = parseFloat(document.getElementById("itemPrice").value);
    const saved = parseFloat(document.getElementById("itemSaved").value) || 0;
    const category = document.getElementById("itemCategory").value;
    const priority = document.getElementById("itemPriority").value;
    const date = document.getElementById("itemDate").value;

    if(!name){ alert("Sila masukkan nama item."); return; }
    if(!price || price <= 0){ alert("Sila masukkan harga item yang sah."); return; }

    const progress = Math.min((saved / price) * 100, 100);

    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    wishlist.push({ name, price, saved, category, priority, date, progress, bought:false });

    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    alert("Item wishlist disimpan.");

    document.getElementById("itemName").value = "";
    document.getElementById("itemPrice").value = "";
    document.getElementById("itemSaved").value = "";
    document.getElementById("itemDate").value = "";

    window.location.href = "wishlist1.html";
  }

  function goBack(){
    window.location.href = "wishlist1.html";
  }
</script>
</body>
</html>
