<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>MyBudgetTracking - Wishlist Utama</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg,#a8dadc,#457b9d); color:#333; min-height:100vh; }
  .header {
    background:#1b263b; color:#fff; padding:15px 20px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .header h1 { margin:0; font-size:20px; font-weight:600; }
  .profile-header { display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#ccc; cursor:pointer; object-fit:cover; }
  .welcome { font-size:14px; font-weight:500; }
  .container { max-width:760px; margin:28px auto; background:#f0f0f0; padding:26px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); text-align:center; }
  .summary { font-size:16px; font-weight:600; color:#1b263b; margin-bottom:18px; }
  .actions-row { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  button { padding:8px 14px; margin:4px; background:#1b263b; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; transition:0.18s; font-size:13px; }
  button:hover { background:#415a77; }
  .btn-secondary { background:#fff; color:#1b263b; border:1px solid #1b263b; }
  ul { list-style:none; padding:0; margin-top:15px; text-align:left; }
  li { background:#e9e9e9; margin:10px 0; padding:12px; border-radius:6px; }
  .progress { background:#ddd; border-radius:6px; overflow:hidden; height:10px; margin-top:6px; }
  .progress-bar { background:#2a9d8f; height:100%; width:0%; transition:width 0.4s; }
  .meta { font-size:13px; color:#444; margin-top:6px; }
  .update-box { margin-top:6px; }
  .update-box input { padding:6px; width:100px; border-radius:6px; border:1px solid #ccc; font-size:13px; }
</style>
</head>
<body>
  <div class="header">
    <h1>MyBudgetTracking</h1>
    <div class="profile-header">
      <div class="welcome">Welcome, <span id="username">Guest</span></div>
      <img id="avatarSmall" class="avatar" src="" alt="avatar" onclick="editProfile()">
    </div>
  </div>

  <div class="container">
    <h2 style="margin-top:0; color:#1b263b;">Wishlist Saya</h2>

    <div class="summary">
      Jumlah Item: <span id="itemCount">0</span><br>
      Jumlah Anggaran Kos: RM <span id="totalCost">0</span>
    </div>

    <ul id="wishlist"></ul>

    <div class="actions-row">
      <button onclick="goAdd()">➕ Tambah Item Baru</button>
      <button class="btn-secondary" onclick="resetWishlist()">🔄 Reset Wishlist</button>
      <button class="btn-secondary" onclick="goDashboard()">⬅ Kembali ke Menu</button>
    </div>
  </div>

<script>
  let wishlist = [];

  window.onload = () => {
    const user = JSON.parse(localStorage.getItem("MBT_user"));
    if(user){
      if(user.username){
        document.getElementById("username").textContent = user.username;
      }
      if(user.avatar){
        document.getElementById("avatarSmall").src = user.avatar;
      }
    }

    const savedWishlist = localStorage.getItem("wishlist");
    if(savedWishlist){ wishlist = JSON.parse(savedWishlist); }
    updateUI();
  };

  function goAdd(){ window.location.href = "wishlist.html"; }
  function goDashboard(){ window.location.href = "dashboard.html"; }
  function editProfile(){ window.location.href = "profile.html"; }

  function resetWishlist(){
    if(!confirm("Betul nak reset semua wishlist?")) return;
    wishlist = [];
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    updateUI();
    alert("Wishlist telah direset.");
  }

  function toggleBought(index){
    wishlist[index].bought = !wishlist[index].bought;
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    updateUI();
  }

  function updateItemSaving(index){
    const input = document.getElementById("add_"+index);
    const tambah = parseFloat(input.value);
    if(tambah && tambah > 0){
      wishlist[index].saved += tambah;
      wishlist[index].progress = Math.min((wishlist[index].saved / wishlist[index].price) * 100, 100);
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      updateUI();
      alert("Progress simpanan dikemaskini.");
      input.value = "";
    }
  }

  function updateUI(){
    const list = document.getElementById("wishlist");
    list.innerHTML = "";
    let totalCost = 0;
    const order = {Tinggi:1,Sederhana:2,Rendah:3};
    const sorted = [...wishlist].sort((a,b)=> order[a.priority]-order[b.priority]);

    sorted.forEach((item) => {
      const originalIndex = wishlist.indexOf(item);
      const li = document.createElement("li");
      li.innerHTML = `
        <div style="display:flex; gap:10px; align-items:flex-start;">
          <input type="checkbox" onchange="toggleBought(${originalIndex})" ${item.bought?"checked":""}>
          <div style="flex:1;">
            <div style="font-weight:700; color:#1b263b;">${item.name} - RM ${Number(item.price).toFixed(2)}</div>
            <div class="meta">Kategori: ${item.category} | Priority: ${item.priority} | Target: ${item.date || "-"}</div>
            <div class="meta">Simpan: RM ${Number(item.saved).toFixed(2)} (${Math.floor(item.progress)}%)</div>
            <div class="progress"><div class="progress-bar" style="width:${item.progress}%"></div></div>
            <div class="update-box">
              <input type="number" id="add_${originalIndex}" placeholder="Tambah (RM)">
              <button onclick="updateItemSaving(${originalIndex})">Update</button>
            </div>
          </div>
        </div>
      `;
      if(item.bought){ li.style.textDecoration="line-through"; li.style.color="#2a9d8f"; }
      list.appendChild(li);
      totalCost += Number(item.price) || 0;
    });

    document.getElementById("itemCount").textContent = wishlist.length;
    document.getElementById("totalCost").textContent = totalCost.toFixed(2);
  }
</script>
</body>
</html>
