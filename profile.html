<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>MyBudgetTracking - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg,#a8dadc,#457b9d); color:#333; min-height:100vh; }
  .header { background:#1b263b; color:#fff; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
  .header h1 { margin:0; font-size:20px; font-weight:600; }
  .profile-header { display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#ccc; cursor:pointer; object-fit:cover; }
  .welcome { font-size:14px; font-weight:500; }
  .container { max-width:600px; margin:40px auto; background:#f0f0f0; padding:30px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); text-align:center; }
  input { padding:10px; margin:8px; width:70%; border-radius:8px; border:1px solid #ccc; background:#e9e9e9; }
  button { padding:10px 20px; margin:5px; background:#1b263b; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
  button:hover { background:#415a77; }
</style>
</head>
<body>
  <div class="header">
    <h1>MyBudgetTracking</h1>
    <div class="profile-header">
      <div class="welcome">Welcome, <span id="username">Guest</span></div>
      <img id="avatarSmall" class="avatar" src="" alt="avatar" onclick="goProfile()">
    </div>
  </div>

  <div class="container">
    <h2>Profile Saya</h2>
    <img id="avatar" src="" alt="avatar besar" style="width:120px;height:120px;border-radius:50%;object-fit:cover;background:#ccc;">
    <p><strong>Nama Pengguna:</strong> <span id="profileName">Guest</span></p>

    <input type="text" id="nameInput" placeholder="Tukar nama pengguna">
    <button onclick="setName()">Simpan Nama</button><br>

    <input type="password" id="passwordInput" placeholder="Tukar password">
    <button onclick="setPassword()">Simpan Password</button><br>

    <input type="file" id="avatarInput" accept="image/*">
    <button onclick="setAvatar()">Simpan Avatar</button><br>

    <button onclick="logout()">Logout</button>
    <button onclick="goDashboard()">⬅ Kembali ke Dashboard</button>
  </div>

<script>
  let user = { username:"Guest", password:"", avatar:"" };

  window.onload = () => {
    const saved = localStorage.getItem("MBT_user");
    if(saved){ user = JSON.parse(saved); }
    updateUI();
  };

  function updateUI(){
    document.getElementById("username").textContent = user.username;
    document.getElementById("profileName").textContent = user.username;
    if(user.avatar){
      document.getElementById("avatar").src = user.avatar;
      document.getElementById("avatarSmall").src = user.avatar;
    } else {
      document.getElementById("avatar").src = "";
      document.getElementById("avatarSmall").src = "";
    }
  }

  function setName(){
    const val = document.getElementById("nameInput").value.trim();
    if(val){
      user.username = val;
      localStorage.setItem("MBT_user", JSON.stringify(user));
      updateUI();
      alert("Nama pengguna dikemaskini.");
      document.getElementById("nameInput").value = "";
    }
  }

  function setPassword(){
    const val = document.getElementById("passwordInput").value.trim();
    if(val){
      user.password = val;
      localStorage.setItem("MBT_user", JSON.stringify(user));
      alert("Password dikemaskini.");
      document.getElementById("passwordInput").value = "";
    }
  }

  function setAvatar(){
    const file = document.getElementById("avatarInput").files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        user.avatar = e.target.result;
        localStorage.setItem("MBT_user", JSON.stringify(user));
        updateUI();
        alert("Avatar dikemaskini.");
      };
      reader.readAsDataURL(file);
    }
  }

  function logout(){
    localStorage.removeItem("MBT_user");
    alert("Anda telah logout.");
    window.location.href = "login.html"; // redirect ke login/menu
  }

  function goDashboard(){ window.location.href = "dashboard.html"; }
  function goProfile(){ window.location.href = "profile.html"; }
</script>
</body>
</html>
