<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - MyBudgetApp</title>
</head>
<body>
  <h2>Login</h2>
  <form onsubmit="login(); return false;">
    <label>Username:</label>
    <input type="text" id="username" required><br><br>
    <label>Password:</label>
    <input type="password" id="password" required><br><br>
    <button type="submit">Login</button>
    <button type="button" onclick="goRegister()">Register</button>
  </form>

  <script>
    function login(){
      try {
        let userData = localStorage.getItem("MBT_user");
        if(!userData){
          alert("No user found. Please register first.");
          return;
        }

        let user = JSON.parse(userData);
        let inputUser = document.getElementById("username").value.trim();
        let inputPass = document.getElementById("password").value.trim();

        if(user && user.username === inputUser && user.password === inputPass){
          alert("Welcome back, " + user.username + "!");
          window.location.href = "dashboard.html";
        } else {
          alert("Invalid login. Please register first.");
        }
      } catch(e){
        console.error("Login error:", e);
        alert("Error reading user data. Please register again.");
      }
    }

    function goRegister(){
      window.location.href = "register.html";
    }
  </script>
</body>
</html>
