<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>MyBudgetTracking - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0d1b2a, #1b263b);
      color: #e0e1dd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #f0f0f0;
      color: #333;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      width: 320px;
      text-align: center;
    }
    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #1b263b;
    }
    input {
      padding: 12px;
      margin: 10px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #e9e9e9;
      color: #333;
      font-size: 14px;
    }
    input:focus {
      border-color: #1b263b;
      outline: none;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #1b263b;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    button:hover {
      background: #415a77;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="title">Login</div>
    <form onsubmit="login(); return false;">
      <input id="username" placeholder="Username" required><br>
      <input id="password" type="password" placeholder="Password" required><br>
      <button type="submit">🔑 Login</button>
      <button type="button" onclick="goRegister()">📝 Create Account</button>
    </form>
  </div>

  <script>
    // Auto masuk kalau session wujud
    window.onload = () => {
      let session = localStorage.getItem("MBT_session");
      if(session){
        window.location.href = "dashboard.html";
      }
    };

    function login(){
      try {
        let userData = localStorage.getItem("MBT_user");
        if(!userData){
          alert("No user found. Please register first.");
          return;
        }

        let user = JSON.parse(userData);
        let inputUser = document.getElementById("username").value.trim();
        let inputPass = document.getElementById("password").value.trim();

        if(user.username === inputUser && user.password === inputPass){
          localStorage.setItem("MBT_session", user.username); // simpan session
          alert("Welcome back, " + user.username + "!");
          window.location.href = "dashboard.html";
        } else {
          alert("Invalid login. Please try again.");
        }
      } catch(e){
        console.error("Login error:", e);
        alert("Error reading user data. Please register again.");
      }
    }

    function goRegister(){
      window.location.href = "register.html";
    }
  </script>
</body>
</html>
