<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>MyBudgetTracking - Register</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b); /* navy gradient */
    color: #e0e1dd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .register-box {
    background: #f0f0f0; /* kelabu lembut */
    color: #333;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    width: 320px;
    text-align: center;
  }
  .title {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #1b263b;
  }
  input {
    padding: 12px;
    margin: 10px 0;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #e9e9e9;
    color: #333;
    font-size: 14px;
  }
  input:focus {
    border-color: #1b263b;
    outline: none;
    background: #fff;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #1b263b;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
  }
  button:hover {
    background: #415a77;
  }
</style>
</head>
<body>
  <div class="register-box">
    <div class="title">Create Account</div>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>
  </div>

<script>
function register(){
  let user = {
    username: document.getElementById("username").value,
    password: document.getElementById("password").value
  };
  localStorage.setItem("MBT_user", JSON.stringify(user));
  alert("Account created! Please login.");
  window.location.href = "login.html";
}
</script>
</body>
</html>
